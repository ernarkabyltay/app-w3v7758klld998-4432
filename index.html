<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Алматы қаласының жедел медициналық жәрдем қызметі</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#12263a;--mute:#5b7083;--line:#dfe7ed;--head:#12263a;
--doc:#1b8a6b;--narc:#c8312f;--med:#2c7bb6;--r:14px}
[data-theme=dark]{--bg:#0d1620;--card:#16232f;--ink:#e8eff5;--mute:#8da2b4;--line:#243747;--head:#0a121a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
header{background:var(--head);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{position:relative;width:64px;height:64px;display:grid;place-items:center;font-size:32px;flex:none}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.brand h1{margin:0;font-size:18px;line-height:1.15}
.brand p{margin:3px 0 0;font-size:13px;opacity:.75}
.lang-btn{flex:none;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:700;letter-spacing:.5px;text-align:center}
.lang-btn:active{background:rgba(255,255,255,.28)}
#search{width:100%;margin-top:12px;padding:11px 14px;border-radius:12px;border:0;font:inherit;background:rgba(255,255,255,.12);color:#fff}
#search::placeholder{color:rgba(255,255,255,.6)}
main{padding:16px;max-width:640px;margin:0 auto}
h2{margin:4px 0 14px;font-size:22px}
.tiles{display:grid;gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px 16px 16px 20px;border-radius:var(--r);background:var(--card);border-left:6px solid var(--c);box-shadow:0 1px 0 var(--line)}
.tile i{font-style:normal;font-size:30px;line-height:1;margin-bottom:6px}
.tile b{font-size:18px}.tile small{color:var(--mute)}
.row{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;padding:12px 14px;background:var(--card);border-radius:var(--r);border-left:6px solid var(--c)}
.ic{width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.ic img,.tile i img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.tile i img{width:34px;height:34px}
.row b{display:block}.row small{color:var(--mute)}
.note{margin:6px 0 14px;padding:10px 12px;border-radius:10px;background:var(--card);color:var(--mute);font-size:13px;border:1px dashed var(--line)}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;color:var(--mute);border-top:3px solid transparent}
nav button span{font-size:21px;line-height:1.1}
nav button.on{color:var(--ink);font-weight:600;border-top-color:var(--c,var(--narc))}
#sheet[hidden]{display:none}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8}
.pn{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));z-index:9;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pn{animation:none}}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.hd .ic{width:60px;height:60px;font-size:32px}
.hd b{font-size:20px;display:block;line-height:1.2}.hd small{color:var(--mute)}
.tx{white-space:pre-line;margin-bottom:18px}
.close{width:100%;padding:13px;border-radius:12px;background:var(--head);color:#fff;text-align:center;font-weight:600}
:focus-visible{outline:3px solid var(--med);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="top-bar">
    <div class="brand">
      <div class="logo">✚<img id="logo" alt="" onerror="this.remove()"></div>
      <div><h1 id="ttl"></h1><p id="sub"></p></div>
    </div>
    <button id="langBtn" class="lang-btn" type="button" aria-label="Тілді ауыстыру / Сменить язык"></button>
  </div>
  <input id="search" type="search" hidden>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="sheet" hidden>
  <div class="bd" data-close></div>
  <div class="pn"><div class="hd" id="shd"></div><div class="tx" id="stx"></div><button class="close" id="closeBtn" data-close></button></div>
</div>

<script>
/* ============ НАСТРОЙКИ: здесь меняете тексты, значки и картинки ============
   icon: эмодзи (например "💊") ИЛИ имя файла картинки (например "ivanov.png"),
   файл нужно загрузить в тот же репозиторий рядом с index.html.             */

const LOGO_FILE = "logo.png"; // загрузите свой логотип с этим именем

const DATA = {
  kk: {
    btnLabel: "РУС", // на кнопке показывается язык, на который можно переключиться
    title: "Алматы қаласының жедел медициналық жәрдем қызметі",
    subtitle: "№10 қ/с фельдшер көмекшісі",
    ui: {
      homeNav: "Басты бет",
      homeTitle: "Не табу керек?",
      count: "Жазбалар саны:",
      searchPlaceholder: "Іздеу",
      empty: "Ештеңе табылмады. Басқа сөз жазып көріңіз.",
      noText: "Сипаттама әлі қосылмаған.",
      close: "Жабу"
    },
    sections: {
      doctors: {
        name: "Аға дәрігерлер", short: "Дәрігерлер", icon: "🩺", color: "var(--doc)",
        note: "",
        items: [
          { icon: "👨‍⚕️", title: "Иванов И.И.", sub: "№1 қосалқы станция", text: "Мұнда кез келген ақпаратты қосуға болады." },
          { icon: "👩‍⚕️", title: "Петрова А.С.", sub: "№2 қосалқы станция", text: "" },
          { icon: "👨‍⚕️", title: "Сериков Е.К.", sub: "№3 қосалқы станция", text: "" }
        ]
      },
      narcotics: {
        name: "Есірткілік препараттар", short: "Есірткілік", icon: "⚠️", color: "var(--narc)",
        note: "Анықтамалық ақпарат. ҚР ДСМ қолданыстағы бұйрықтары мен хаттамаларымен салыстырыңыз.",
        items: [
          { icon: "💉", title: "Препарат атауы 1", sub: "Шығарылу түрі", text: "Сақтау, есепке алу және есептен шығару ережелері — қолданыстағы бұйрықтан мәтін қойыңыз." },
          { icon: "💉", title: "Препарат атауы 2", sub: "Шығарылу түрі", text: "" }
        ]
      },
      meds: {
        name: "Дәрілік препараттар", short: "Дәрілер", icon: "💊", color: "var(--med)",
        note: "Анықтамалық ақпарат. Дозалар мен көрсеткіштерді қолданыстағы хаттамалармен салыстырыңыз.",
        items: [
          { icon: "💊", title: "Препарат атауы 1", sub: "Тобы", text: "Көрсеткіштері, қарсы көрсеткіштері, шығарылу түрі." },
          { icon: "💊", title: "Препарат атауы 2", sub: "Тобы", text: "" },
          { icon: "🧪", title: "Препарат атауы 3", sub: "Тобы", text: "" }
        ]
      }
    }
  },

  ru: {
    btnLabel: "ҚАЗ",
    title: "Служба скорой медицинской помощи г. Алматы",
    subtitle: "Помощник фельдшера п/с №10",
    ui: {
      homeNav: "Главная",
      homeTitle: "Что нужно найти?",
      count: "Записей:",
      searchPlaceholder: "Поиск",
      empty: "Ничего не найдено. Попробуйте другое слово.",
      noText: "Описание пока не добавлено.",
      close: "Закрыть"
    },
    sections: {
      doctors: {
        name: "Старшие врачи", short: "Врачи", icon: "🩺", color: "var(--doc)",
        note: "",
        items: [
          { icon: "👨‍⚕️", title: "Иванов И.И.", sub: "Подстанция №1", text: "Здесь можно добавить любую информацию." },
          { icon: "👩‍⚕️", title: "Петрова А.С.", sub: "Подстанция №2", text: "" },
          { icon: "👨‍⚕️", title: "Сериков Е.К.", sub: "Подстанция №3", text: "" }
        ]
      },
      narcotics: {
        name: "Наркотические препараты", short: "Наркотические", icon: "⚠️", color: "var(--narc)",
        note: "Справочная информация. Сверяйтесь с действующими приказами и протоколами МЗ РК.",
        items: [
          { icon: "💉", title: "Название препарата 1", sub: "Форма выпуска", text: "Правила хранения, учёта и списания — вставьте текст из действующего приказа." },
          { icon: "💉", title: "Название препарата 2", sub: "Форма выпуска", text: "" }
        ]
      },
      meds: {
        name: "Лекарственные препараты", short: "Лекарства", icon: "💊", color: "var(--med)",
        note: "Справочная информация. Дозы и показания сверяйте с действующими протоколами.",
        items: [
          { icon: "💊", title: "Название препарата 1", sub: "Группа", text: "Показания, противопоказания, форма выпуска." },
          { icon: "💊", title: "Название препарата 2", sub: "Группа", text: "" },
          { icon: "🧪", title: "Название препарата 3", sub: "Группа", text: "" }
        ]
      }
    }
  }
};
/* ============================ КОНЕЦ НАСТРОЕК ============================ */

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.theme = tg.colorScheme; }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ico = s => /\.(png|jpe?g|svg|webp|gif)$/i.test(s || "") ? `<img src="${esc(s)}" alt="">` : esc(s);

let lang = localStorage.getItem("smp_lang") || "kk";
if (!DATA[lang]) lang = "kk";

let cur = "home", q = "", openIndex = null;

$("#logo").src = LOGO_FILE;

function applyLang() {
  const d = DATA[lang];
  document.documentElement.lang = lang;
  document.title = d.title;
  $("#ttl").textContent = d.title;
  $("#sub").textContent = d.subtitle;
  $("#langBtn").textContent = d.btnLabel;
  $("#search").placeholder = d.ui.searchPlaceholder;
  $("#closeBtn").textContent = d.ui.close;

  $("#nav").innerHTML =
    `<button data-k="home" style="--c:var(--head)"><span>🏠</span>${esc(d.ui.homeNav)}</button>` +
    Object.entries(d.sections).map(([k, s]) =>
      `<button data-k="${k}" style="--c:${s.color}"><span>${ico(s.icon)}</span>${esc(s.short)}</button>`).join("");

  render();

  // Если открыто окно с карточкой — обновляем его текст на новом языке
  if (!$("#sheet").hidden && openIndex !== null && cur !== "home") {
    openItem(openIndex);
  }
}

function render() {
  const d = DATA[lang];
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.k === cur));
  $("#search").hidden = cur === "home";
  const v = $("#view");

  if (cur === "home") {
    v.innerHTML = `<h2>${esc(d.ui.homeTitle)}</h2><div class="tiles">` +
      Object.entries(d.sections).map(([k, s]) =>
        `<button class="tile" data-k="${k}" style="--c:${s.color}"><i>${ico(s.icon)}</i><b>${esc(s.name)}</b><small>${esc(d.ui.count)} ${s.items.length}</small></button>`).join("") +
      `</div>`;
    return;
  }

  const s = d.sections[cur], t = q.trim().toLowerCase();
  const rows = s.items.map((it, i) => ({ it, i })).filter(({ it }) =>
    !t || [it.title, it.sub, it.text].join(" ").toLowerCase().includes(t));

  v.innerHTML = `<h2>${esc(s.name)}</h2>` + (s.note ? `<div class="note">${esc(s.note)}</div>` : "") +
    (rows.length ? rows.map(({ it, i }) =>
      `<button class="row" data-i="${i}" style="--c:${s.color}"><span class="ic">${ico(it.icon)}</span><span><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></span></button>`).join("")
      : `<div class="empty">${esc(d.ui.empty)}</div>`);
}

function openItem(i) {
  openIndex = i;
  const d = DATA[lang];
  const it = d.sections[cur].items[i];
  if (!it) return;
  $("#shd").innerHTML = `<span class="ic">${ico(it.icon)}</span><span><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></span>`;
  $("#stx").textContent = it.text || d.ui.noText;
  $("#sheet").hidden = false;
}

$("#langBtn").addEventListener("click", () => {
  lang = lang === "kk" ? "ru" : "kk";
  localStorage.setItem("smp_lang", lang);
  applyLang();
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-k],[data-i],[data-close]");
  if (!t) return;
  if (t.dataset.close !== undefined) { $("#sheet").hidden = true; openIndex = null; return; }
  if (t.dataset.k) { cur = t.dataset.k; q = ""; $("#search").value = ""; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.i) openItem(+t.dataset.i);
});

$("#search").addEventListener("input", e => { q = e.target.value; render(); });

applyLang();
</script>
</body>
</html>
