<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Алматы қаласының жедел медициналық жәрдем қызметі</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#12263a;--mute:#5b7083;--line:#dfe7ed;--head:#12263a;
--doc:#1b8a6b;--narc:#c8312f;--med:#2c7bb6;--warn:#d97706;--ref:#6d28d9;--r:14px}
[data-theme=dark]{--bg:#0d1620;--card:#16232f;--ink:#e8eff5;--mute:#8da2b4;--line:#243747;--head:#0a121a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
header{background:var(--head);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.logo{position:relative;width:64px;height:64px;display:grid;place-items:center;font-size:32px;flex:none}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.brand-txt{flex:1;min-width:0}
.brand h1{margin:0;font-size:18px;line-height:1.15}
.brand p{margin:3px 0 0;font-size:13px;opacity:.75}
.lang{flex:none;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:700}
#search{width:100%;margin-top:12px;padding:11px 14px;border-radius:12px;border:0;font:inherit;background:rgba(255,255,255,.12);color:#fff}
#search::placeholder{color:rgba(255,255,255,.6)}
main{padding:16px;max-width:640px;margin:0 auto}
h2{margin:4px 0 14px;font-size:22px}
.back{display:inline-block;margin-bottom:12px;padding:8px 12px;border-radius:10px;background:var(--card);font-size:14px;font-weight:600;box-shadow:0 1px 0 var(--line)}
.tiles{display:grid;gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px 16px 16px 20px;border-radius:var(--r);background:var(--card);border-left:6px solid var(--c);box-shadow:0 1px 0 var(--line)}
.tile i{font-style:normal;font-size:30px;line-height:1;margin-bottom:6px}
.tile b{font-size:18px}.tile small{color:var(--mute)}
.row{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;padding:12px 14px;background:var(--card);border-radius:var(--r);border-left:6px solid var(--c)}
.ic{width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.ic img,.tile i img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.tile i img{width:34px;height:34px}
.row b{display:block}.row small{color:var(--mute)}
.note{margin:6px 0 14px;padding:10px 12px;border-radius:10px;background:var(--card);color:var(--mute);font-size:13px;border:1px dashed var(--line)}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;color:var(--mute);border-top:3px solid transparent;text-align:center}
nav button span{font-size:21px;line-height:1.1}
nav button.on{color:var(--ink);font-weight:600;border-top-color:var(--c,var(--narc))}

/* Всплывающее окно карточки */
#sheet[hidden],#imgModal[hidden]{display:none}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8}
.pn{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));z-index:9;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pn{animation:none}}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.hd .ic{width:54px;height:54px;font-size:28px}
.hd b{font-size:19px;display:block;line-height:1.2}.hd small{color:var(--mute)}

/* Стили для контента, схем и картинок внутри карточки */
.tx{margin-bottom:18px;font-size:15px;line-height:1.55}
.tx h3{margin:16px 0 6px;font-size:16px;color:var(--ink)}
.tx h3:first-child{margin-top:0}
.tx p{margin:0 0 10px}
.tx ul{margin:0 0 12px;padding-left:20px}
.tx li{margin-bottom:5px}
.scheme{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--bg);border-left:4px solid var(--med);font-size:14px}
.scheme.alert{border-left-color:var(--narc)}
.scheme b{display:block;margin-bottom:4px;font-size:15px}
.tx img{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin:12px 0;background:var(--bg);border:1px solid var(--line);cursor:zoom-in}
.img-hint{display:block;text-align:center;font-size:12px;color:var(--mute);margin:-8px 0 12px}

/* Полноэкранный просмотр схемы/картинки */
#imgModal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#imgModal img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px}
#imgModal button{margin-top:14px;padding:10px 24px;border-radius:10px;background:#fff;color:#000;font-weight:600}

.close{width:100%;padding:13px;border-radius:12px;background:var(--head);color:#fff;text-align:center;font-weight:600}
:focus-visible{outline:3px solid var(--med);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">✚<img id="logo" alt="" onerror="this.remove()"></div>
    <div class="brand-txt"><h1 id="ttl"></h1><p id="sub"></p></div>
    <button class="lang" id="langBtn" type="button">РУС</button>
  </div>
  <input id="search" type="search" placeholder="Поиск" hidden>
</header>
<main id="view"></main>
<nav id="nav"></nav>

<div id="sheet" hidden>
  <div class="bd" data-close></div>
  <div class="pn">
    <div class="hd" id="shd"></div>
    <div class="tx" id="stx"></div>
    <button class="close" id="clsBtn" data-close>Закрыть</button>
  </div>
</div>

<!-- Окно для увеличения картинок и схем -->
<div id="imgModal" hidden>
  <img id="fullImg" src="" alt="">
  <button type="button" id="closeImgBtn">Жабу / Закрыть</button>
</div>

        items: [
          { icon: "👨‍⚕️", title: "Контакты старших врачей", sub: "Центр и подстанции", text: "<p>Телефоны для консультаций и оперативной связи.</p>" },
          { icon: "🏥", title: "Стационары г. Алматы", sub: "Адреса и профили", text: "<p>Список городских клинических больниц и приёмных покоев.</p>" }
        ]
      }
    }
  }
};

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.theme = tg.colorScheme; }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ico = s => /\.(png|jpe?g|svg|webp|gif)$/i.test(s || "") ? `<img src="${esc(s)}" alt="">` : esc(s);
const stripTags = s => String(s || "").replace(/<[^>]*>/g, " ");

let lang = "kk", cur = "home", q = "", openIdx = null;
$("#logo").src = LOGO;

function initLang() {
  const d = DB[lang];
  document.documentElement.lang = lang;
  document.title = d.title;
  $("#ttl").textContent = d.title;
  $("#sub").textContent = d.subtitle;
  $("#langBtn").textContent = d.btn;
  $("#search").placeholder = d.search;
  $("#clsBtn").textContent = d.close;

  $("#nav").innerHTML =
    `<button data-k="home" style="--c:var(--head)"><span>🏠</span>${esc(d.homeNav)}</button>` +
    d.navKeys.map(k => {
      const s = d.sections[k];
      return `<button data-k="${k}" style="--c:${s.color}"><span>${ico(s.icon)}</span>${esc(s.short)}</button>`;
    }).join("");

  render();
  if (!$("#sheet").hidden && openIdx !== null && cur !== "home") openItem(openIdx);
}

function render() {
  const d = DB[lang];
  const isHomeSub = d.homeKeys.indexOf(cur) !== -1;
  const navActive = isHomeSub ? "home" : cur;

  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.k === navActive));
  $("#search").hidden = cur === "home";
  const v = $("#view");

  if (cur === "home") {
    v.innerHTML = `<h2>${esc(d.homeTitle)}</h2><div class="tiles">` +
      d.homeKeys.map(k => {
        const s = d.sections[k];
        return `<button class="tile" data-k="${k}" style="--c:${s.color}"><i>${ico(s.icon)}</i><b>${esc(s.name)}</b><small>${esc(d.count)} ${s.items.length}</small></button>`;
      }).join("") +
      `</div>`;
    return;
  }

  const s = d.sections[cur], t = q.trim().toLowerCase();
  const rows = s.items.map((it, i) => ({ it, i })).filter(({ it }) =>
    !t || [it.title, it.sub, stripTags(it.text)].join(" ").toLowerCase().includes(t));

  v.innerHTML =
    (isHomeSub ? `<button class="back" data-k="home">${esc(d.back)}</button>` : "") +
    `<h2>${esc(s.name)}</h2>` +
    (s.note ? `<div class="note">${esc(s.note)}</div>` : "") +
    (rows.length ? rows.map(({ it, i }) =>
      `<button class="row" data-i="${i}" style="--c:${s.color}"><span class="ic">${ico(it.icon)}</span><span><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></span></button>`).join("")
      : `<div class="empty">${esc(d.empty)}</div>`);
}

function openItem(i) {
  openIdx = i;
  const d = DB[lang];
  const it = d.sections[cur].items[i];
  $("#shd").innerHTML = `<span class="ic">${ico(it.icon)}</span><span><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></span>`;
  $("#stx").innerHTML = it.text || `<p>${esc(d.noText)}</p>`;
  $("#sheet").hidden = false;
  $("#sheet .pn").scrollTop = 0;
}

$("#langBtn").addEventListener("click", () => {
  lang = lang === "kk" ? "ru" : "kk";
  initLang();
});

document.addEventListener("click", e => {
  // Увеличение картинки при нажатии внутри карточки
  if (e.target.matches("#stx img")) {
    $("#fullImg").src = e.target.src;
    $("#imgModal").hidden = false;
    return;
  }
  const t = e.target.closest("[data-k],[data-i],[data-close]");
  if (!t) return;
  if (t.dataset.close !== undefined) { $("#sheet").hidden = true; openIdx = null; return; }
  if (t.dataset.k) { cur = t.dataset.k; q = ""; $("#search").value = ""; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.i) openItem(+t.dataset.i);
});

$("#closeImgBtn").addEventListener("click", () => { $("#imgModal").hidden = true; });
$("#imgModal").addEventListener("click", e => { if (e.target.id === "imgModal") $("#imgModal").hidden = true; });
$("#search").addEventListener("input", e => { q = e.target.value; render(); });

initLang();
</script>
</body>
</html>
